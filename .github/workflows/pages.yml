name: pages

# Deploys from the repository's default branch, which is currently
# `claude/youthful-brahmagupta-la5z3o` rather than `main`; both are listed so
# this keeps working if the default is renamed.
#
# This workflow cannot deploy until Pages is enabled for the repository with
# its source set to GitHub Actions (Settings -> Pages). That is a repository
# setting, not something a commit can turn on.
on:
  push:
    branches: [main, claude/youthful-brahmagupta-la5z3o]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Never publish a build that cannot reproduce METEOR's output.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
