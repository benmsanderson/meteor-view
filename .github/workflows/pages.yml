name: pages

# Deploys from the repository's default branch, which is currently
# `claude/youthful-brahmagupta-la5z3o` rather than `main`; both are listed so
# this keeps working if the default is renamed.
#
# This workflow cannot deploy until Pages is enabled for the repository with
# its source set to GitHub Actions (Settings -> Pages). That is a repository
# setting, not something a commit can turn on.
on:
  push:
    branches: [main, claude/youthful-brahmagupta-la5z3o]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Every model but the default comes from the GitHub release pinned in
      # data/artifacts_v1.json. Cached on that file, so a build downloads only
      # when the release changes; the script verifies each zip's SHA-256.
      - uses: actions/cache@v4
        with:
          path: .artifacts-cache
          key: artifacts-${{ hashFiles('data/artifacts_v1.json') }}

      - run: node scripts/fetch-artifacts.mjs

      # The summaries take minutes to compute and change only when the data or
      # the code that computes them does; build-summary.mjs checks the same
      # inputs by content before trusting what the cache restores.
      - uses: actions/cache@v4
        with:
          path: data/summary_v1
          key: summaries-${{ hashFiles('data/artifacts_v1.json', 'data/cities_v1.json', 'data/degree_days_v1/**', 'src/app/summary.js', 'src/app/explorer.js', 'src/app/map.js', 'src/app/chart.js', 'src/lib/**', 'scripts/build-summary.mjs') }}

      # Never publish a build that cannot reproduce METEOR's output.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
